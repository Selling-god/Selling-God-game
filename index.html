  <title>RIFT DECK - Dynamic Server Required</title>
  <style>
    body{margin:0;background:#071019;color:#e9f4ff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}.box{max-width:760px;border:1px solid #24445c;background:#0b1722;padding:28px;border-radius:18px;box-shadow:0 20px 80px #0008}.tag{font-size:12px;letter-spacing:.16em;color:#6ee7d8}.bad{color:#ff9a9a}code{background:#08121b;padding:2px 6px;border-radius:6px}h1{margin:.35em 0}.steps{line-height:1.8;color:#bcd0df}
  </style>

<body>
  <div class="box">
    <div class="tag">RIFT-V2.2-20260910</div>
    <h1>RIFT DECK는 동적 Web Service가 필요합니다.</h1>
    <p class="bad">현재 이 화면이 보인다면 Render가 게임 서버가 아니라 정적 사이트 파일을 제공하고 있습니다.</p>
    <div class="steps">Render에서 이 저장소를 <b>Node Web Service</b>로 배포하고 Build Command를 <code>npm ci && npm run build</code>, Start Command를 <code>npm start</code>로 지정하세요. 정상 배포에서는 이 파일이 아니라 <code>public/index.html</code>이 서버를 통해 표시됩니다.</div>
  </div>
</body>
