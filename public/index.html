<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="RIFT DECK - 카드 수집과 1~4인 협동 던전 클리어를 결합한 브라우저 로그라이트" />
  <title>RIFT DECK : ABYSS EXPEDITION</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="boot-title">RIFT DECK</div>
    <div class="boot-sub">ABYSS EXPEDITION</div>
    <div class="boot-line"><i></i></div>
    <div class="boot-copy">DYNAMIC SERVER CONNECTING...</div>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <button class="brand pixel-button ghost" data-action="home" aria-label="홈으로">
        <span class="brand-rune">◇</span>
        <span><b>RIFT DECK</b><small>ABYSS EXPEDITION</small></span>
      </button>
      <div id="serverBadge" class="server-badge"><span></span>SERVER</div>
      <div class="top-spacer"></div>
      <div class="wallet" title="프리즘"><span>◆</span><b id="gemCount">0</b></div>
      <div class="wallet dust" title="잔광"><span>✦</span><b id="dustCount">0</b></div>
      <button id="soundBtn" class="icon-button" title="사운드 켜기/끄기" aria-label="사운드">♪</button>
      <button class="profile-chip" data-action="profile"><span id="avatarMini">R</span><b id="nicknameMini">방랑자</b></button>
    </header>

    <main id="screen" class="screen"></main>

    <footer class="footer-bar">
      <span>RIFT DECK v1.0</span>
      <span class="footer-hint">마우스/터치 · 전투: 숫자키 카드 선택 · E 턴 종료</span>
    </footer>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
