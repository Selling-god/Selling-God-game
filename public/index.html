<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#24293e" />
  <meta name="description" content="FUSEWILD - 몬스터 전투와 5턴 융합을 결합한 오리지널 로그라이트" />
  <title>FUSEWILD : MONSTER FUSION ROGUELITE</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css?v=FUSEWILD-V760-RESPONSIVE-UI-20260918" />
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-grid"></div>
    <div class="boot-core"><span></span><span></span><span></span></div>
    <div class="boot-title">FUSEWILD</div>
    <div class="boot-sub">MONSTER FUSION // WAVE BATTLE // ROGUELITE v7.5.0</div>
    <div class="boot-line"><i></i></div>
    <div class="boot-copy">CONNECTING TO DYNAMIC SERVER...</div>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="홈으로">
        <span class="brand-mark">◇</span>
        <span class="brand-copy"><b>FUSEWILD</b><small>MONSTER FUSION ROGUELITE</small></span>
      </button>
      <div id="serverBadge" class="server-badge"><span></span>LIVE SERVER</div>
      <div class="top-spacer"></div>
      <div class="wallet legacy-currency" title="레거시 재화" aria-hidden="true"><span>◆</span><b id="gemCount">0</b></div>
      <div class="wallet coin" title="몬스터 소환 코인"><span>●</span><b id="coinCount">0</b></div>
      <div class="wallet dust legacy-currency" title="레거시 재화" aria-hidden="true"><span>✦</span><b id="dustCount">0</b></div>
      <button id="fxBtn" class="icon-button" data-action="fx" title="전투 이펙트">✦</button>
      <button id="soundBtn" class="icon-button" data-action="sound" title="사운드">♪</button>
      <button class="profile-chip" data-action="profile"><span id="avatarMini">R</span><b id="nicknameMini">방랑자</b></button>
    </header>

    <main id="screen" class="screen"></main>

    <footer class="footer-bar">
      <span id="versionLabel">FUSEWILD</span>
      <span class="footer-hint">기술 1~4 · 1턴 융합 · 전용기/디버프 표시 · ESC 뒤로</span>
    </footer>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <script>
  window.__RIFT_DEPLOY_ID__ = 'FUSEWILD-V750-POKEROGUE-UX-20260918';
  (async function resetLegacyCaches(){
    try {
      if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch (e) { console.warn('[FUSEWILD] legacy cache reset skipped', e); }
  })();
  </script>
  <script src="/app.js?v=FUSEWILD-V760-RESPONSIVE-UI-20260918" defer></script>
</body>
</html>
